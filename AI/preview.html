<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOVA & LUNA 3D Preview</title>
  <link rel="stylesheet" href="nova.css?v=10">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>body{min-height:100vh;margin:0;background:radial-gradient(circle at 30% 20%,#10255b,#030713 65%);font-family:system-ui;color:#fff}main{max-width:760px;padding:48px}h1{margin:0 0 10px}p{color:#9fb4dc}</style>
</head>
<body><main><h1>NOVA & LUNA — Mascot Preview</h1><p>Mở trợ lý, nhấn nút đổi nhân vật trên header và thử các state trong Console.</p></main><script>window.addEventListener('nova:ready',event=>{const query=new URLSearchParams(location.search),id=query.get('character');if(id)event.detail.nova.setCharacter(id);if(query.get('open')==='1')requestAnimationFrame(()=>event.detail.nova.openChat())})</script><script type="module" src="bootstrap.js?v=21"></script></body>
</html>
