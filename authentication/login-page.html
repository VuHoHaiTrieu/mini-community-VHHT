<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <title>Đăng nhập</title>
    <link rel="icon" type="image/png" href="../shared/assets/brand/vhht-favicon.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../shared/brand-system.css?v=3">
    <link rel="stylesheet" href="../shared/audio/sound-controls.css?v=1">
    <link rel="stylesheet" href="./authentication-pages-styles.css?v=auth-layout-14">
    <link rel="stylesheet" href="./authentication-page-effects.css?v=11">
    <link rel="stylesheet" href="./authentication-identity.css?v=1">
</head>
<body class="authentication-page login-page">
    <main class="authentication-container">
        <section class="auth-brand-story" aria-labelledby="auth-brand-title">
            <div class="auth-brand-lockup">
                <span class="vhht-logo-light vhht-logo-light--lockup"><img class="vhht-brand-lockup auth-brand-logo" src="../shared/assets/brand/vhht-logo-horizontal.png?v=2" alt="Cộng đồng VHHT"></span>
            </div>
            <span class="auth-eyebrow">CHÀO MỪNG BẠN TRỞ LẠI</span>
            <h2 id="auth-brand-title">Hãy đăng nhập để tiếp tục.</h2>
            <p>Những bất ngờ và thú vị đang chờ bạn phía sau.</p>
            <div class="auth-trust" aria-label="Điểm nổi bật">
                <span><i class="fa-solid fa-comments" aria-hidden="true"></i> Kết nối dễ dàng</span>
                <span><i class="fa-solid fa-sliders" aria-hidden="true"></i> Trải nghiệm mượt mà</span>
            </div>
        </section>

        <section class="authentication-card" aria-labelledby="login-title">
            <div class="auth-card-guide" aria-live="polite" aria-atomic="true">
                <span class="auth-guide-orb" aria-hidden="true"><i class="fa-solid fa-handshake"></i></span>
                <span data-auth-guide>Sẵn sàng trở lại</span>
            </div>
            <header class="authentication-header">
                <span class="form-kicker">ĐĂNG NHẬP</span>
                <h1 id="login-title">Chào mừng trở lại</h1>
            </header>

            <form class="authentication-form" id="login-form" novalidate>
                <div class="authentication-field">
                    <label for="login-email-input">Tên đăng nhập hoặc email</label>
                    <div class="input-group">
                        <i class="fa-solid fa-user left-icon" aria-hidden="true"></i>
                        <input id="login-email-input" class="authentication-input" type="text" placeholder="Tên đăng nhập hoặc email" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="login-email-error">
                    </div>
                    <small class="field-message" id="login-email-error"></small>
                </div>

                <div class="authentication-field">
                    <label for="login-password-input">Mật khẩu</label>
                    <div class="input-group has-password-toggle">
                        <i class="fa-solid fa-lock left-icon" aria-hidden="true"></i>
                        <input id="login-password-input" class="authentication-input" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required aria-describedby="login-password-error">
                        <button class="toggle-password" id="toggle-login-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" data-ui-sound="toggle-on">
                            <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                        </button>
                    </div>
                    <small class="field-message" id="login-password-error"></small>
                </div>

                <a class="forgot-password-trigger" href="./forgot-password-page.html">Quên mật khẩu?</a>

                <div id="login-status-message" class="authentication-status-message" role="status" aria-live="polite"></div>

                <button id="login-account-button" class="authentication-button" type="submit">
                    <span class="button-label">Đăng nhập</span>
                    <i class="fa-solid fa-arrow-right button-arrow" aria-hidden="true"></i>
                </button>
            </form>

            <div class="auth-provider-section">
                <div class="auth-provider-divider" aria-hidden="true"><span>hoặc</span></div>
                <button id="google-auth-button" class="google-auth-button" type="button" aria-label="Tiếp tục với Google">
                    <svg class="google-auth-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="#4285F4" d="M21.6 12.23c0-.72-.06-1.4-.18-2.05H12v3.87h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.35Z"/>
                        <path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.63-2.42l-3.24-2.51c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.59A10 10 0 0 0 12 22Z"/>
                        <path fill="#FBBC05" d="M6.39 13.9A6 6 0 0 1 6.08 12c0-.66.11-1.3.31-1.9V7.51H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.49l3.35-2.59Z"/>
                        <path fill="#EA4335" d="M12 5.97c1.47 0 2.79.5 3.83 1.5l2.87-2.88A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.96 5.51L6.39 10.1C7.18 7.73 9.39 5.97 12 5.97Z"/>
                    </svg>
                    <span>Tiếp tục với Google</span>
                </button>
            </div>

            <footer class="authentication-footer">
                <span>Chưa có tài khoản?</span>
                <a href="./register-page.html">Tạo tài khoản mới</a>
            </footer>
        </section>

        <section class="auth-mobile-context" aria-label="Thông tin trải nghiệm">
            <p>Tiếp tục nơi các bạn đã dừng.</p>
            <div>
                <span><i class="fa-solid fa-comments" aria-hidden="true"></i> Thuận tiện</span>
                <span><i class="fa-solid fa-sliders" aria-hidden="true"></i> Tùy chỉnh</span>
            </div>
        </section>
    </main>
    <script type="module" src="./authentication-handler.js?v=auth-experience-10"></script>
    <script type="module" src="./authentication-page-effects.js?v=14"></script>
    <script type="module" src="../shared/audio/sound-controls.js?v=6"></script>
</body>
</html>
