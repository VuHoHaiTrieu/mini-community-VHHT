<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Đăng nhập - mini-community-VHHT
    </title>

    <link rel="stylesheet"
        href="./authentication-pages-styles.css">

</head>

<body>

    <div class="authentication-container">

        <div class="authentication-card">

            <div class="authentication-header">

                <h1>
                    Chào mừng 👋
                </h1>

                <p>
                    Đăng nhập để tham gia cộng đồng VHHT
                </p>

            </div>



            <div class="authentication-form">

                <input
                    id="login-email-input"
                    class="authentication-input"
                    type="email"
                    placeholder="Nhập email">

                <input
                    id="login-password-input"
                    class="authentication-input"
                    type="password"
                    placeholder="Nhập mật khẩu">

                <button
                    id="login-account-button"
                    class="authentication-button">

                    Đăng nhập

                </button>

            </div>



            <div
                id="login-status-message"
                class="authentication-status-message">

            </div>



            <div class="authentication-footer">

                <a href="./register-page.html">
                    Chưa có tài khoản? Đăng ký
                </a>

            </div>

        </div>

    </div>



    <script type="module"
        src="./authentication-handler.js"></script>

</body>

</html>
