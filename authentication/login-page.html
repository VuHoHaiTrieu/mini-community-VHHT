<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - mini-community-VHHT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./authentication-pages-styles.css">
    <link rel="stylesheet" href="./authentication-enhancements.css">
</head>
<body>
    <div class="authentication-container">
        <section class="auth-brand-story"><div class="auth-planet"><i class="fa-solid fa-user-astronaut"></i></div><span class="auth-eyebrow">VHHT COSMIC NETWORK</span><h2>Kết nối những tín hiệu giữa không gian.</h2><p>Một cộng đồng nhỏ, an toàn và sống động—nơi mỗi bài viết là một tín hiệu đang bay trên quỹ đạo riêng.</p><div class="auth-trust"><span><i class="fa-solid fa-bolt"></i> Thời gian thực</span><span><i class="fa-solid fa-shield-halved"></i> Bảo mật Firebase</span></div></section>
        <div class="authentication-card">
            <div class="authentication-header">
                <span class="form-kicker">ĐĂNG NHẬP</span><h1>Chào mừng trở lại</h1>
                <p>Đăng nhập để tham gia cộng đồng VHHT</p>
            </div>
            <div class="authentication-form">
                <div class="input-group">
                    <input id="login-email-input" class="authentication-input" type="email" placeholder="Nhập email">
                    <i class="fa-solid fa-envelope left-icon"></i>
                </div>
                <div class="input-group">
                    <input id="login-password-input" class="authentication-input" type="password" placeholder="Nhập mật khẩu">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <i class="fa-solid fa-eye-slash toggle-password" id="toggle-login-password"></i>
                </div>
                <button id="login-account-button" class="authentication-button">Đăng nhập</button>
            </div>
            <div id="login-status-message" class="authentication-status-message"></div>
            <div class="authentication-footer">
                <a href="./register-page.html">Chưa có tài khoản? Đăng ký</a>
            </div>
        </div>
    </div>
    <script type="module" src="./authentication-handler.js"></script>
</body>
</html>
