<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Đăng ký - mini-community-VHHT
    </title>

    <link rel="stylesheet"
        href="./authentication-pages-styles.css">

</head>

<body>

    <div class="authentication-container">

        <div class="authentication-card">

            <div class="authentication-header">

                <h1>
                    Tạo tài khoản
                </h1>

                <p>
                    Tham gia cộng đồng cùng VHHT
                </p>

            </div>



            <div class="authentication-form">

                <input
                    id="display-name-input"
                    class="authentication-input"
                    type="text"
                    placeholder="Tên hiển thị">

                <input
                    id="email-input"
                    class="authentication-input"
                    type="email"
                    placeholder="Email">

                <input
                    id="password-input"
                    class="authentication-input"
                    type="password"
                    placeholder="Mật khẩu">

                <input
                    id="confirm-password-input"
                    class="authentication-input"
                    type="password"
                    placeholder="Xác nhận mật khẩu">

                <button
                    id="register-account-button"
                    class="authentication-button">

                    Đăng ký

                </button>

            </div>



            <div
                id="authentication-status-message"
                class="authentication-status-message">

            </div>



            <div class="authentication-footer">

                <a href="./login-page.html">
                    Đã có tài khoản? Đăng nhập
                </a>

            </div>

        </div>

    </div>



    <script type="module"
        src="./authentication-handler.js"></script>

</body>

</html>
