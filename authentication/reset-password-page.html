<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <title>Đặt mật khẩu mới · VHHT</title>
    <link rel="icon" type="image/png" href="../shared/assets/brand/vhht-favicon.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../shared/brand-system.css?v=3">
    <link rel="stylesheet" href="./authentication-pages-styles.css?v=auth-layout-12">
    <link rel="stylesheet" href="./authentication-page-effects.css?v=11">
    <link rel="stylesheet" href="./authentication-identity.css?v=3">
</head>
<body class="authentication-page login-page">
    <main class="authentication-container">
        <section class="auth-brand-story" aria-labelledby="reset-brand-title"><div class="auth-brand-lockup"><span class="vhht-logo-light vhht-logo-light--lockup"><img class="vhht-brand-lockup auth-brand-logo" src="../shared/assets/brand/vhht-logo-horizontal.png?v=2" alt="Cộng đồng VHHT"></span></div><span class="auth-eyebrow">XÁC THỰC THÀNH CÔNG</span><h2 id="reset-brand-title">Tạo mật khẩu mới.</h2><p>Mã bảo mật trong liên kết email sẽ được kiểm tra trước khi mật khẩu được thay đổi.</p></section>
        <section class="authentication-panel" aria-labelledby="reset-title">
            <div class="auth-guide"><span class="auth-guide-orb" aria-hidden="true"><i class="fa-solid fa-key"></i></span><span id="reset-account-label">Đang kiểm tra mã xác thực…</span></div>
            <header class="authentication-header"><span class="form-kicker">MẬT KHẨU MỚI</span><h1 id="reset-title">Đặt lại mật khẩu</h1></header>
            <form class="authentication-form" id="password-reset-confirm-form" hidden novalidate>
                <div class="authentication-field"><label for="new-password-input">Mật khẩu mới</label><div class="input-group has-password-toggle"><i class="fa-solid fa-lock left-icon"></i><input id="new-password-input" class="authentication-input" type="password" minlength="6" autocomplete="new-password" required></div></div>
                <div class="authentication-field"><label for="confirm-new-password-input">Nhập lại mật khẩu</label><div class="input-group"><i class="fa-solid fa-shield-halved left-icon"></i><input id="confirm-new-password-input" class="authentication-input" type="password" minlength="6" autocomplete="new-password" required aria-describedby="reset-password-error"></div><small class="field-message" id="reset-password-error"></small></div>
                <button id="confirm-reset-button" class="authentication-button" type="submit"><span class="button-label">Cập nhật mật khẩu</span><i class="fa-solid fa-check button-arrow"></i></button>
            </form>
            <div id="password-reset-confirm-status" class="authentication-status-message" role="status" aria-live="polite"></div>
            <a class="authentication-back-link" href="./login-page.html"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
        </section>
    </main>
    <link rel="stylesheet" href="../shared/ui-selection-policy.css?v=1">
    <script type="module" src="./password-recovery.js?v=2"></script>
</body>
</html>
