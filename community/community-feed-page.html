<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title> Community - VHHT</title>
    <link rel="icon" type="image/png" href="../shared/assets/brand/vhht-favicon.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/brand-system.css?v=3">
    <link rel="stylesheet" href="../shared/audio/sound-controls.css?v=1">
    <link rel="stylesheet" href="community-feed-styles.css?v=23">
    <link rel="stylesheet" href="community-toolbar.css">
    <link rel="stylesheet" href="community-layout-fixes.css">
    <link rel="stylesheet" href="post-detail-fixes.css">
    <link rel="stylesheet" href="reaction-usability.css?v=2">
    <link rel="stylesheet" href="admin-mode-position.css?v=1">
    <link rel="stylesheet" href="../shared/destructive-actions.css?v=1">
    <link rel="stylesheet" href="../shared/responsive-foundation.css?v=1">
    <link rel="stylesheet" href="community-responsive.css?v=14">
    <link rel="stylesheet" href="post-detail-redesign.css?v=10">
    <link rel="stylesheet" href="community-composer-polish.css?v=1">
    <link rel="stylesheet" href="community-composer-collapse.css?v=2">
    <link rel="stylesheet" href="community-meteor-posts.css?v=6">
    <link rel="stylesheet" href="community-meteor-detail.css?v=3">
    <link rel="stylesheet" href="community-mobile-refinement.css?v=2">
    <link rel="stylesheet" href="post-detail-actions-polish.css?v=13">
    <link rel="stylesheet" href="../AI/nova.css?v=10">
    <style>.active-now{box-shadow:0 0 0 3px #22c55e!important}.quick-accept{display:inline-block;width:max-content;margin-top:7px;padding:6px 9px;border-radius:8px;background:#0ea5e9;color:white;font-style:normal;font-weight:700}</style>
</head>
<body class="community-feed-page">

    <canvas id="cosmic-universe-canvas"></canvas>

    <div class="community-topbar">
        <div class="community-logo">
            <span class="vhht-logo-light vhht-logo-light--lockup"><img class="vhht-brand-lockup community-brand-lockup" src="../shared/assets/brand/vhht-logo-horizontal.png?v=2" alt="VHHT Cosmic Community"></span>
        </div>
        <div class="community-search-panel" id="community-search-panel">
            <button class="mobile-community-search-toggle" id="mobile-community-search-toggle" type="button" aria-label="Mở tìm kiếm thành viên" aria-expanded="false" data-ui-sound="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <input id="community-user-search" type="search" placeholder="Tìm thành viên theo tên hoặc ID" autocomplete="off">
            <div id="community-search-results" class="community-search-results"></div>
        </div>
        <div class="community-user-panel">
            <button class="community-user-status" id="community-user-status" title="Bấm để đổi trạng thái hoạt động">
                <span class="online-status-dot"></span><span id="online-status-text">Trực tuyến</span>
            </button>
            <button class="topbar-tool-button" id="community-messages-button" title="Tin nhắn" data-ui-sound="none">
                <i class="fa-solid fa-comment-dots"></i><span class="tool-badge" id="message-badge" hidden>0</span>
            </button>
            <button class="topbar-tool-button" id="community-notifications-button" title="Thông báo" data-ui-sound="notification">
                <i class="fa-solid fa-bell"></i><span class="tool-badge" id="top-notification-badge" hidden>0</span>
            </button>
            <div class="community-account">
                <button class="community-account-trigger" id="community-account-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="community-account-menu" data-ui-sound="click-secondary">
                    <img id="community-profile-avatar" alt="Ảnh đại diện">
                    <span class="account-trigger-copy"><strong id="community-current-user-display-name">Thành viên VHHT</strong><small>Tài khoản</small></span>
                    <i class="fa-solid fa-chevron-down account-chevron" aria-hidden="true"></i>
                </button>
                <div class="community-account-menu" id="community-account-menu" role="menu" hidden>
                    <div class="account-menu-heading"><img id="community-account-menu-avatar" alt=""><span><strong id="community-account-menu-name">Thành viên VHHT</strong><small>Quản lý tài khoản của bạn</small></span></div>
                    <div class="account-menu-separator"></div>
                    <button type="button" role="menuitem" id="community-profile-button" data-ui-sound="none"><i class="fa-regular fa-user"></i><span><strong>Xem hồ sơ</strong><small>Trang cá nhân và bài viết</small></span></button>
                    <button type="button" role="menuitem" id="community-settings-button" data-ui-sound="none"><i class="fa-solid fa-sliders"></i><span><strong>Cài đặt</strong><small>Thông tin, riêng tư và hiển thị</small></span></button>
                    <div class="account-menu-separator"></div>
                    <button type="button" role="menuitem" class="account-menu-logout" id="community-logout-button"><i class="fa-solid fa-arrow-right-from-bracket"></i><span><strong>Đăng xuất</strong><small>Rời tài khoản trên thiết bị này</small></span></button>
                </div>
            </div>
        </div>
    </div>

    <div class="community-post-feed-container" id="community-post-feed-container">
    </div>

    <div class="my-posts-fixed-panel collapsed" id="my-posts-fixed-panel">
        <div class="my-posts-header">
            <h2>THÔNG BÁO</h2>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="my-posts-count-indicator">Hoạt động mới</span>
                <button id="toggle-my-posts-panel-button" data-ui-sound="notification">
                    <i class="fa-solid fa-chevron-left" id="toggle-icon-arrow"></i>
                    <div class="notification-badge" id="notification-badge" style="display: none;">0</div>
                </button>
            </div>
        </div>
        <nav class="notification-filters" id="notification-filters" aria-label="Lọc thông báo">
            <button type="button" class="active" data-notification-filter="all">Tất cả</button>
            <button type="button" data-notification-filter="reaction">Cảm xúc</button>
            <button type="button" data-notification-filter="comment">Bình luận</button>
            <button type="button" data-notification-filter="other">Khác</button>
        </nav>
        <div id="my-own-posts-container" class="notification-list">
        </div>
    </div>

    <div class="community-create-post-container-wrapper">
        <button type="button" id="community-composer-toggle" class="community-composer-toggle" aria-expanded="true" aria-controls="community-create-post-form" title="Thu gọn khung đăng bài">
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i><span>Thu gọn</span>
        </button>
        <div class="community-create-post-container" id="community-create-post-form">
            <label for="main-post-file-input" class="attach-file-label main-attach" title="Đính kèm dữ liệu ảnh/video">
                <i class="fa-solid fa-paperclip"></i>
            </label>
            <input type="file" id="main-post-file-input" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime" style="display: none;">
            
            <textarea id="main-post-textarea" placeholder="Nhập nội dung bài đăng"></textarea>
            <select id="main-post-privacy" class="quick-post-privacy" title="Quyền riêng tư"><option value="public">🌐 Công khai</option><option value="friends">👥 Bạn bè</option><option value="private">🔒 Chỉ mình tôi</option></select>
            
            <button id="create-community-post-button" title="Phóng bài viết">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <div class="image-preview-container main-post-preview" id="main-post-preview-box" style="display: none;">
            <div id="main-preview-render-zone"></div>
            <button class="remove-preview-btn" id="remove-main-preview-btn">&times;</button>
        </div>
    </div>

    <div class="post-details-overlay" id="post-details-overlay">
        <div class="post-details-modal" data-mobile-view="post">
            <button class="close-modal-button" id="close-modal-button" title="Đóng bảng tín hiệu">&times;</button>
            <div class="mobile-detail-tabs" role="tablist" aria-label="Nội dung chi tiết bài viết">
                <button type="button" class="mobile-detail-tab active" data-detail-view="post" role="tab" aria-selected="true">
                    <i class="fa-regular fa-newspaper"></i><span>Bài viết</span>
                </button>
                <button type="button" class="mobile-detail-tab" data-detail-view="comments" role="tab" aria-selected="false">
                    <i class="fa-regular fa-comments"></i><span>Bình luận</span>
                </button>
            </div>
            
            <div class="modal-layout">
                <div class="modal-left-content">
                    <div class="modal-post-main-card">
                        <div class="modal-author-header">
                            <img id="modal-post-avatar" class="modal-post-avatar" alt="Ảnh đại diện">
                            <div><button class="modal-post-author" id="modal-post-author">---</button><div class="modal-post-time" id="modal-post-time">--:--</div></div>
                        </div>
                        <div class="modal-post-text" id="modal-post-text">---</div>
                        
                        <div class="modal-post-image-container" id="modal-post-image-container"></div>
                    </div>

                    <div class="modal-post-actions">
                        <button type="button" class="modal-reaction-summary" id="modal-reaction-summary" aria-label="Xem người đã bày tỏ cảm xúc" aria-haspopup="dialog" aria-controls="reaction-details-overlay" aria-expanded="false" title="Xem danh sách cảm xúc">
                            <span class="summary-icons" id="summary-active-emojis" aria-hidden="true"></span>
                            <span class="summary-reaction-count" id="summary-reaction-count">0</span>
                        </button>
                        <div class="modal-primary-actions">
                        <div class="reaction-outer-wrapper">
                            <div class="reaction-container">
                                <button class="modal-action-btn" id="modal-like-button">
                                    <span id="current-user-reaction-icon">👍</span>
                                    <span id="reaction-btn-text">Thích</span>
                                </button>
                                
                                <div class="reaction-popover">
                                    <span class="react-emoji" data-type="like" title="Thích">👍</span>
                                    <span class="react-emoji" data-type="love" title="Yêu thích">❤️</span>
                                    <span class="react-emoji" data-type="haha" title="Haha">😂</span>
                                    <span class="react-emoji" data-type="wow" title="Wow">😮</span>
                                    <span class="react-emoji" data-type="sad" title="Phẫn nộ">😡</span>
                                    <span class="react-emoji" data-type="sorry" title="Bi thương (Rớt nước mắt)">😢</span>
                                </div>
                            </div>

                        </div>

                            <button type="button" class="modal-post-share-button" id="modal-post-share-button" aria-label="Chia sẻ bài viết" title="Chia sẻ bài viết">
                                <i class="fa-solid fa-reply" aria-hidden="true"></i><span class="share-button-label">Chia sẻ</span><span class="share-button-count" id="modal-post-share-count">0</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="modal-right-comments">
                    <header class="comments-panel-heading">
                        <span class="comments-heading-icon"><i class="fa-regular fa-comments"></i></span>
                        <span><strong>Thảo luận</strong></span>
                        <span class="comments-total" title="Số bình luận" aria-label="Số bình luận"><i class="fa-regular fa-comment"></i><strong id="modal-comment-count">0</strong></span>
                    </header>
                    
                    <div class="modal-comments-tree" id="modal-comments-tree"></div>

                    <div class="modal-comment-input-area">
                        <div class="replying-to-banner" id="replying-to-banner" style="display: none;">
                            <span id="replying-to-text">Đang phản hồi...</span>
                            <button class="cancel-reply-button" id="cancel-reply-button" title="Hủy bỏ phản hồi">&times;</button>
                        </div>

                        <div class="image-preview-container" id="comment-image-preview-box" style="display: none;">
                            <div id="comment-preview-render-zone"></div>
                            <button class="remove-preview-btn" id="remove-comment-img-btn">&times;</button>
                        </div>

                        <div class="input-wrapper">
                            <label for="comment-image-input" class="attach-file-label" title="Đính kèm hình ảnh/văn bản vào hội thoại">
                                <i class="fa-solid fa-camera"></i>
                            </label>
                            <input type="file" id="comment-image-input" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime" style="display: none;">
                            
                            <input type="text" id="modal-comment-input" placeholder="Viết phản hồi...">
                            
                            <button id="submit-comment-button" title="Gửi phản hồi">
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="reaction-details-overlay" id="reaction-details-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="reaction-details-title" hidden>
        <div class="reaction-details-modal" role="document">
            <header class="reaction-details-heading">
                <span class="reaction-details-heading-icon"><i class="fa-regular fa-face-smile"></i></span>
                <span><h3 id="reaction-details-title">Người đã bày tỏ cảm xúc</h3><small>Xem cảm xúc của mọi người với bài viết</small></span>
                <button class="close-react-modal-btn" id="close-react-modal-btn" title="Đóng danh sách" aria-label="Đóng danh sách"><i class="fa-solid fa-xmark"></i></button>
            </header>
            
            <div class="react-tabs-header" id="react-tabs-header">
            </div>
            
            <div class="react-users-list" id="react-users-list">
            </div>
        </div>
    </div>

    <div class="media-lightbox-container" id="media-lightbox-container">
        <button class="close-lightbox-btn" id="close-lightbox-btn">&times;</button>
        <div class="lightbox-controls" aria-label="Điều khiển ảnh">
            <button type="button" id="lightbox-zoom-out" aria-label="Thu nhỏ"><i class="fa-solid fa-minus"></i></button>
            <output id="lightbox-zoom-value">100%</output>
            <button type="button" id="lightbox-zoom-in" aria-label="Phóng to"><i class="fa-solid fa-plus"></i></button>
            <button type="button" id="lightbox-zoom-reset" aria-label="Đặt lại"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
        <div class="lightbox-zoom-wrapper" id="lightbox-zoom-wrapper"></div>
        <div class="lightbox-hint">Lăn chuột hoặc chụm hai ngón để thu phóng • Kéo để di chuyển</div>
    </div>

    <script type="module" src="realtime-feed-handler.js?v=interactive-text-49"></script>
    <script type="module" src="composer-collapse.js?v=2"></script>
    <script type="module" src="../shared/audio/sound-controls.js?v=6"></script>
  <script src="../shared/mobile-gesture-guard.js?v=2"></script>
  <script type="module" src="../AI/bootstrap.js?v=21"></script>
</body>
</html>
