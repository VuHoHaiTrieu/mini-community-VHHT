<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Nhắn tin - VHHT</title>
    <link rel="icon" type="image/png" href="../../shared/assets/brand/vhht-favicon.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../shared/brand-system.css?v=3">
    <link rel="stylesheet" href="../../shared/audio/sound-controls.css?v=1">
    <link rel="stylesheet" href="messages-styles.css?v=2">
    <link rel="stylesheet" href="messages-media.css?v=9">
    <link rel="stylesheet" href="messages-realtime.css?v=4">
    <link rel="stylesheet" href="messages-actions.css?v=4">
    <link rel="stylesheet" href="messages-settings.css?v=10">
    <link rel="stylesheet" href="messages-notes.css?v=22">
    <link rel="stylesheet" href="../../shared/responsive-foundation.css?v=1">
    <link rel="stylesheet" href="messages-responsive.css?v=6">
    <link rel="stylesheet" href="messages-modern.css?v=9">
    <link rel="stylesheet" href="messages-mobile-refinement.css?v=6">
    <link rel="stylesheet" href="messages-composer-effects.css?v=4">
    <link rel="stylesheet" href="messages-timeline.css?v=2">
    <link rel="stylesheet" href="../../AI/nova.css?v=10">
</head>
<body>
    <div class="nebula" aria-hidden="true"></div>
    <main class="messenger-shell">
        <aside class="conversation-sidebar" aria-label="Danh sách trò chuyện">
            <header class="messenger-brand">
                <button id="back-button" type="button" title="Quay lại cộng đồng" aria-label="Quay lại cộng đồng" data-ui-sound="none">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                </button>
                <span class="vhht-logo-light vhht-logo-light--mark"><img class="vhht-brand-mark messages-brand-mark" src="../../shared/assets/brand/vhht-logo-mark.png?v=2" alt="Biểu trưng VHHT"></span>
                <div>
                    <h1>Nhắn tin</h1>
                </div>
            </header>
            <label class="conversation-search" for="friend-filter">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input id="friend-filter" type="search" placeholder="Tìm bạn bè..." autocomplete="off">
            </label>
            <section class="messenger-notes" aria-label="Ghi chú của bạn và bạn bè">
                <div class="messenger-notes-rail" id="messenger-notes-rail" aria-label="Ghi chú và bạn bè gần đây"></div>
            </section>
            <nav class="conversation-filters" aria-label="Bộ lọc hội thoại">
                <button type="button" class="conversation-filter active" data-filter="all">Tất cả</button>
                <button type="button" class="conversation-filter" data-filter="unread">Chưa đọc</button>
                <button type="button" class="conversation-filter" data-filter="groups">Nhóm chat</button>
                <div class="conversation-more-wrap">
                    <button type="button" class="conversation-filter conversation-more-trigger" id="conversation-more-trigger" aria-label="Bộ lọc khác" aria-expanded="false"><i class="fa-solid fa-ellipsis"></i></button>
                    <div class="conversation-more-menu" id="conversation-more-menu" hidden>
                        <button type="button" data-filter="active"><i class="fa-solid fa-circle"></i> Đang hoạt động</button>
                        <button type="button" data-filter="notes"><i class="fa-regular fa-note-sticky"></i> Có ghi chú</button>
                    </div>
                </div>
            </nav>
            <div class="conversation-title">
                <strong>Đoạn chat</strong>
            </div>
            <div id="friends-list" class="friends-list"></div>
        </aside>

        <section class="chat-panel" aria-label="Cuộc trò chuyện">
          <div class="chat-main-column">
            <header id="chat-header">
                <div class="empty-orbit">
                    <span class="empty-orbit-icon"><i class="fa-solid fa-satellite" aria-hidden="true"></i></span>
                    <div>
                        <strong>Chưa chọn cuộc trò chuyện</strong>
                        <small>Chọn một người bạn trong danh sách</small>
                    </div>
                </div>
            </header>
            <div class="chat-wallpaper-layer" aria-hidden="true"></div>
            <div id="messages-list" class="messages-list" aria-live="polite">
                <div class="welcome-signal">
                    <span><i class="fa-solid fa-satellite-dish" aria-hidden="true"></i></span>
                    <h2>Nhắn tin</h2>
                    <p>Không gian trò chuyện riêng dành cho những người đã kết bạn.</p>
                </div>
            </div>
            <button id="jump-to-latest-message" class="jump-to-latest-message" type="button" aria-label="Đi đến tin nhắn mới nhất" title="Tin nhắn mới nhất" hidden>
                <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
            </button>
            <form id="message-form">
                <button type="button" class="message-tool composer-more-button" id="composer-more-button" title="Mở thêm công cụ" aria-label="Mở thêm công cụ" aria-expanded="true" disabled data-ui-sound="open-panel"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                <button type="button" class="message-tool message-effect-button composer-aux-tool" id="message-effect-button" title="Hiệu ứng gửi" aria-label="Chọn hiệu ứng gửi" aria-expanded="false" disabled data-ui-sound="open-panel"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></button>
                <button type="button" class="message-tool" id="message-emoji-button" title="Biểu cảm" aria-label="Chọn biểu cảm" disabled data-ui-sound="open-panel">
                    <i class="fa-regular fa-face-smile" aria-hidden="true"></i>
                </button>
                <button type="button" class="message-tool voice-record-button" id="voice-record-button" title="Gửi tin nhắn thoại" aria-label="Ghi âm tin nhắn" disabled>
                    <i class="fa-solid fa-microphone" aria-hidden="true"></i>
                </button>
                <textarea id="message-input" rows="1" placeholder="Nhập tin nhắn..." aria-label="Nội dung tin nhắn" disabled></textarea>
                <button type="button" class="message-tool quick-chat-emoji" id="quick-chat-emoji" title="Gửi emoji nhanh" aria-label="Gửi emoji nhanh" disabled data-ui-sound="click-primary">👍</button>
                <button class="send-message-button" type="submit" title="Gửi tin nhắn" aria-label="Gửi tin nhắn" disabled>
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                </button>
            </form>
          </div>
          <div class="chat-settings-backdrop" data-chat-settings-close hidden></div>
          <aside id="chat-settings-panel" class="chat-settings-panel" aria-label="Cài đặt đoạn chat" aria-hidden="true"></aside>
        </section>
    </main>
    <dialog class="messenger-note-dialog" id="messenger-note-dialog" aria-labelledby="messenger-note-dialog-title">
        <form method="dialog" class="messenger-note-card" id="messenger-note-form">
            <header>
                <div class="note-dialog-identity">
                    <img id="note-dialog-avatar" src="../../shared/assets/default-avatar.png?v=3" alt="">
                    <span><small id="note-dialog-eyebrow">Ghi chú 24 giờ</small><strong id="messenger-note-dialog-title">Ghi chú của bạn</strong></span>
                </div>
                <button type="button" class="note-dialog-close" id="note-dialog-close" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div class="note-editor-content" id="note-editor-content">
                <textarea id="note-content-input" maxlength="160" placeholder="Bạn đang nghĩ gì?" aria-label="Nội dung ghi chú"></textarea>
                <div class="note-editor-meta"><span><i class="fa-regular fa-clock"></i> Tự xóa sau 24 giờ</span><b id="note-character-count">0/160</b></div>
                <p class="note-form-feedback" id="note-form-feedback" role="status" aria-live="polite" hidden></p>
            </div>
            <div class="note-detail-content" id="note-detail-content" hidden>
                <p id="note-detail-text"></p>
                <small id="note-detail-expiry"></small>
                <label class="note-reply-field" id="note-reply-field" hidden>
                    <span>Trả lời ghi chú</span>
                    <textarea id="note-reply-input" maxlength="500" placeholder="Viết câu trả lời…"></textarea>
                </label>
            </div>
            <section class="note-reactions-panel" id="note-reactions-panel" hidden>
                <div class="note-reaction-picker" id="note-reaction-picker" aria-label="Thả cảm xúc cho ghi chú"></div>
                <button type="button" class="note-reaction-summary" id="note-reaction-summary" hidden></button>
                <div class="note-reaction-list" id="note-reaction-list" hidden></div>
            </section>
            <footer>
                <button type="button" class="note-delete-button" id="note-delete-button" hidden><i class="fa-regular fa-trash-can"></i> Xóa ghi chú</button>
                <button type="button" class="note-message-button" id="note-message-button" hidden><i class="fa-solid fa-paper-plane"></i> Gửi trả lời</button>
                <button type="button" class="note-save-button" id="note-save-button"><i class="fa-solid fa-wand-magic-sparkles"></i> Chia sẻ ghi chú</button>
            </footer>
        </form>
    </dialog>
    <dialog class="note-reaction-viewer" id="note-reaction-viewer" aria-labelledby="note-reaction-viewer-title">
        <div class="note-reaction-viewer-card">
            <header>
                <div><span class="note-reaction-viewer-icon"><i class="fa-regular fa-face-smile"></i></span><span><strong id="note-reaction-viewer-title">Cảm xúc về ghi chú</strong><small id="note-reaction-viewer-count">0 người đã bày tỏ cảm xúc</small></span></div>
                <button type="button" id="note-reaction-viewer-close" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <nav class="note-reaction-filters" id="note-reaction-filters" aria-label="Lọc theo cảm xúc"></nav>
            <div class="note-reaction-viewer-list" id="note-reaction-viewer-list"></div>
        </div>
    </dialog>
    <script type="module" src="messages-logic.js?v=interactive-text-61"></script>
    <script type="module" src="../../shared/audio/sound-controls.js?v=6"></script>
  <script src="../../shared/mobile-gesture-guard.js?v=2"></script>
  <script type="module" src="../../AI/bootstrap.js?v=20"></script>
</body>
</html>
