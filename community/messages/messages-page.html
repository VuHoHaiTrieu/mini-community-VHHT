<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Link - Tin nhắn VHHT</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="messages-styles.css"></head><body><div class="nebula"></div><main class="messenger-shell"><aside class="conversation-sidebar"><header class="messenger-brand"><button id="back-button" title="Quay lại cộng đồng"><i class="fa-solid fa-arrow-left"></i></button><div><h1>Cosmic Link</h1><small>Tin nhắn riêng tư</small></div><span class="secure-channel" title="Kênh dành cho bạn bè"><i class="fa-solid fa-shield-halved"></i></span></header><div class="conversation-search"><i class="fa-solid fa-magnifying-glass"></i><input id="friend-filter" placeholder="Tìm bạn bè..."></div><div class="conversation-title"><strong>Đoạn chat</strong><span id="conversation-count">0</span></div><div id="friends-list" class="friends-list"></div></aside><section class="chat-panel"><header id="chat-header"><div class="empty-orbit"><span class="empty-orbit-icon"><i class="fa-solid fa-satellite"></i></span><div><strong>Chưa chọn cuộc trò chuyện</strong><small>Chọn một người bạn bên trái</small></div></div></header><div id="messages-list" class="messages-list"><div class="welcome-signal"><span><i class="fa-solid fa-satellite-dish"></i></span><h2>Cosmic Link</h2><p>Không gian trò chuyện riêng dành cho những người đã kết bạn.</p><small><i class="fa-solid fa-lock"></i> Chỉ hai người trong cuộc trò chuyện có thể tham gia</small></div></div><form id="message-form"><button type="button" class="message-tool" id="message-emoji-button" title="Biểu cảm" disabled><i class="fa-regular fa-face-smile"></i></button><textarea id="message-input" rows="1" placeholder="Nhập tin nhắn..." disabled></textarea><button class="send-message-button" disabled title="Gửi tin nhắn"><i class="fa-solid fa-paper-plane"></i></button></form></section></main><script type="module" src="messages-logic.js"></script></body></html>
